<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My reports — City Grid</title>
  <meta name="description" content="Your City Grid civic reports — same account as the Android app." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/site.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="brand" href="../../index.html">
        <img src="../../assets/logo.png" alt="" />
        City Grid
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="../../index.html">Home</a>
        <a href="../../c/index.html">Citizen</a>
        <a href="index.html" aria-current="page">My reports</a>
        <a href="../../privacy/index.html">Privacy</a>
      </nav>
    </header>

    <main class="landing">
      <div class="landing-bg" aria-hidden="true"></div>
      <div class="landing-card" style="max-width:560px">
        <button type="button" class="card-close" data-close-card aria-label="Close">×</button>
        <img class="mark" src="../../assets/logo.png" alt="City Grid" />
        <h1>My reports</h1>
        <p class="sub">Same account as the app</p>
        <div class="toolbar-row">
          <span class="email" id="userEmail">…</span>
          <button type="button" class="btn btn-ghost" id="signOutBtn">Sign out</button>
        </div>
        <p id="listMsg" class="auth-msg" role="status" aria-live="polite">Loading…</p>
        <ul class="report-list" id="reportList"></ul>
        <p class="meta" style="margin-top:18px">
          New reports are filed in the
          <a href="https://play.google.com/store/apps/details?id=in.citygrid.citizen">Android app</a>
          (camera + GPS). This page shows status for reports tied to your login.
        </p>
      </div>
    </main>

    <footer class="foot">
      <div>© <span data-year>2026</span> City Grid</div>
      <div><a href="../../index.html">← Home</a></div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/supabase-config.js"></script>
  <script src="../../assets/cg-auth.js"></script>
  <script src="../../assets/year.js"></script>
  <script src="../../assets/close-card.js"></script>
  <script>
(function () {
  var authUrl = "../../auth/index.html?role=citizen";
  var listEl = document.getElementById("reportList");
  var msgEl = document.getElementById("listMsg");

  if (!CgAuth.configOk()) {
    msgEl.className = "auth-msg is-err";
    msgEl.textContent = "Missing supabase-config.js — generate it, then reload.";
    return;
  }
  var client = CgAuth.createClient();
  if (!client) {
    msgEl.className = "auth-msg is-err";
    msgEl.textContent = "Could not load Supabase client.";
    return;
  }

  document.getElementById("signOutBtn").addEventListener("click", async function () {
    await CgAuth.signOut(client);
    location.replace(authUrl);
  });

  async function boot() {
    var session = await CgAuth.getSession(client);
    if (!session) {
      location.replace(authUrl);
      return;
    }
    document.getElementById("userEmail").textContent =
      (session.user && session.user.email) || "Signed in";
    await CgAuth.ensureCitizenProfile(client);
    var r = await CgAuth.fetchMyReports(client);
    if (!r.ok) {
      msgEl.className = "auth-msg is-err";
      msgEl.textContent = r.message || "Could not load reports.";
      return;
    }
    if (!r.reports.length) {
      msgEl.className = "auth-msg";
      msgEl.textContent = "No reports on this account yet. File one from the app, then refresh.";
      return;
    }
    msgEl.textContent = r.reports.length + " report" + (r.reports.length === 1 ? "" : "s");
    msgEl.className = "auth-msg is-ok";
    listEl.innerHTML = r.reports
      .map(function (row) {
        var title = CgAuth.issueLabel(row.issue_type);
        var area = row.area_label ? " · " + row.area_label : "";
        var when = CgAuth.formatWhen(row.created_at_ms);
        var st = CgAuth.statusLabel(row);
        return (
          '<li class="report-card">' +
          "<h3>" +
          escapeHtml(title) +
          "</h3>" +
          '<p class="report-meta">' +
          escapeHtml(when) +
          escapeHtml(area) +
          (row.city_key ? " · " + escapeHtml(row.city_key) : "") +
          "</p>" +
          '<span class="report-status">' +
          escapeHtml(st) +
          "</span>" +
          "</li>"
        );
      })
      .join("");
  }

  function escapeHtml(s) {
    return String(s || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  boot();
})();
  </script>
</body>
</html>
